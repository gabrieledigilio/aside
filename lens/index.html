<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The glasses browser caches hard and has no reload button, so this page must never be cached. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aside shows the point, the shape of the idea and the next question while someone explains something to you.">
<!-- Tells Meta Ray-Ban Display to route D-pad and pinch input to this page. -->
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Aside">
<title>Aside</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="lens.css">
</head>
<body>
<main id="root" data-view="standby" aria-live="polite">
  <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
  <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>

  <header id="status">
    <span id="dot" aria-hidden="true"></span>
    <span id="stateText">Standing by</span>
    <span id="clock"></span>
    <span id="notice" role="status"></span>
    <span id="ears"></span>
    <button id="pause" type="button">Pause</button>
  </header>

  <!-- While someone is talking -->
  <section id="live">
    <h1 id="headline"></h1>
    <div id="stageHead">
      <span id="sceneTitle"></span>
      <span class="rule" aria-hidden="true"></span>
      <svg id="spinner" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" pathLength="100"/></svg>
    </div>
    <div id="stage"></div>
    <p id="term"></p>
    <div id="ask"><span class="tag">Ask</span><p id="askText"></p></div>
  </section>

  <!-- When they put a question to you -->
  <section id="turn">
    <span class="tag">They asked</span>
    <h1 id="asked"></h1>
    <span class="tag quiet" id="repliesTag">You could say</span>
    <ol id="replies"></ol>
  </section>

  <!-- Standing by, the pre-brief, and the recap -->
  <section id="sheet"></section>

</main>

<script src="gist-core.js"></script>
<script src="lens.js"></script>
</body>
</html>
